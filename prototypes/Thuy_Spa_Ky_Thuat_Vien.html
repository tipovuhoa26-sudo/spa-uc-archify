function tasksPage(){return heading('tasks','',btn('add','new-task','','primary','plus'))+`<div class="kanban">${['todo','doing','done'].map(status=>`<section class="kanban-col"><h3>${e(t(status))} <span class="badge">${state.tasks.filter(x=>x.status===status).length}</span></h3>${state.tasks.filter(x=>x.status===status).map(x=>`<article class="kanban-card"><span class="badge priority-${x.priority}">${e(t(x.priority))}</span><h3 style="margin-top:12px">${e(x.name||t(x.key))}</h3><p>${ic('calendar',13)} ${dt(x.date)}</p><div class="actions"><span class="avatar">T</span>${status!=='done'?btn('next','task-next',x.id,'small'):badge('done')}</div></article>`).join('')}</section>`).join('')}</div>`}
function qualityPage(){return heading('quality','',btn('incident','new-incident','','primary','plus'))+`<section class="panel">${state.incidents.length?state.incidents.map(x=>`<div class="training-row"><span class="circle-icon">${ic('heart')}</span><div><h3>${e(cName(x.customer))}</h3><p>${e(x.note)}</p><p>${dt(x.date)}</p></div>${x.resolved?badge('resolved'):btn('resolve','resolve',x.id,'small')}</div>`).join(''):`<div class="empty">${ic('heart',28)}${e(t('allClear'))}</div>`}</section>`}

if(settingTab==='data')return `<section class="panel panel-pad"><h2>Google Sheets</h2><p style="margin:12px 0">lecamvan1980@gmail.com · ${badge('notConnected')}</p><div class="info-strip">${e(t('dataNote'))}</div><div class="actions">${btn('export','export','','','download')}${btn('resetDemo','reset-demo','','danger')}</div></section>`;
return `<section class="panel">${state.audit.length?state.audit.slice(0,40).map(a=>`<div class="training-row"><span class="circle-icon">${ic('clock')}</span><div><h3>${e(a.action)}</h3><p>${e(t(a.role))} · ${new Date(a.at).toLocaleString()}</p></div></div>`).join(''):`<div class="empty">${e(t('empty'))}</div>`}</section>`}

function bookingModal(id){const b=state.bookings.find(x=>x.id===id);if(!b||!scopedBookings().some(x=>x.id===id))return;const s=state.services.find(x=>x.id===b.service);let actions='';if(role==='admin'&&b.status==='pending')actions+=btn('decline','decline',id,'danger')+btn('confirm','confirm',id,'primary');if(['admin','manager','technician'].includes(role)&&b.status==='confirmed')actions+=btn('complete','complete',id,'primary');if(['admin','manager'].includes(role)&&b.status==='completed'&&!b.paid)actions+=btn('recordPayment','payment',id,'primary');if(['admin','customer','manager'].includes(role)&&['pending','confirmed'].includes(b.status)&&!b.request)actions+=btn(b.status==='pending'?'cancelBooking':'requestCancel','cancel-booking',id,'danger')+btn('requestChange','request-change',id);if(role==='admin'&&b.request)actions+=btn('rejectRequest','reject-request',id)+btn('acceptRequest','approve-request',id,'primary');modal(cName(b.customer),`<div class="actions" style="margin-bottom:23px">${badge(b.status)}${b.paid?badge('paid'):''}</div><div class="detail-grid">${[['service',sName(s)],['branch',bName(b.branch)],['date',dt(b.date)+' · '+b.time],['staff',stName(b.staff)],['price',money(b.price)+' AUD'],['duration',b.duration+' '+t('minutes')]].map(([k,v])=>`<div><small>${e(t(k))}</small><p>${e(v)}</p></div>`).join('')}</div>${b.request?`<div class="info-strip">${e(t(b.request.type==='cancel'?'cancelRequest':'changeRequest'))}${b.request.date?' · '+dt(b.request.date)+' '+b.request.time:''}</div>`:''}<div class="info-strip"><b>${e(t('reminder'))}</b><br>${e(t(reminderHours(b)===2?'reminder2':'reminder8'))}<br>${e(t('reminderNote'))}</div>${role!=='customer'?`<label class="check"><input type="checkbox" data-consent="${b.id}" ${b.consent?'checked':''}>${e(t('consentLabel'))}</label><p class="consent">${e(t('consentNote'))}</p>`:''}<p class="muted" style="font-size:11px;margin-top:15px">${e(t('payAfter'))}</p><div class="actions" style="margin-top:24px">${actions}</div>`)}
function newBooking(serviceId='',preset={}){const s=state.services.find(x=>x.id===serviceId)||state.services[0];modal(t('newBooking'),`<form id="booking-form"><div class="info-strip">${e(t('bookingNotice'))}</div><div class="form-grid">${field('name','name',role==='customer'&&page!=='portal'?cName(guestId):'','text','required maxlength="100"')}${field('email','email',role==='customer'&&page!=='portal'?state.customers[0].email:'','email','required')}${select('service','service',state.services.map(s=>[s.id,sName(s)]),s.id,'required')}${select('branch','branch',branchOpts(),preset.branch||s.branches[0],'required')}${select('staff','staff',state.staff.map(s=>[s.id,s.name]),preset.staff||state.staff[0].id,'required')}${field('date','date',preset.date||addDays(dayKey(),1),'date',`required min="${dayKey()}"`)}${field('time','time','10:00','time','required step="900"')}<div class="field"><span>${e(t('price'))}</span><strong id="booking-price" style="padding:10px 0">${money(s.price)} AUD</strong></div></div><p class="demo-note">${e(t('payAfter'))} ${e(t('personalNote'))}</p>${formEnd('requestBooking')}`);updateBookingOptions(preset.staff)}
function updateBookingOptions(preferred=''){let f=$('#booking-form');if(!f)return;let s=state.services.find(s=>s.id===f.elements.service.value),b=f.elements.branch.value;const bs=state.branches.filter(b=>s.branches.includes(b.id));f.elements.branch.innerHTML=bs.map(x=>`<option value="${x.id}" ${x.id===b?'selected':''}>${e(x.name)}</option>`).join('');b=f.elements.branch.value;let old=preferred||f.elements.staff.value;f.elements.staff.innerHTML=`<option value="any">${e(t('anyTherapist'))}</option>`+state.staff.filter(x=>x.branches.includes(b)&&x.skills.includes(s.id)).map(x=>`<option value="${x.id}" ${x.id===old?'selected':''}>${e(x.name)}</option>`).join('');$('#booking-price').textContent=money(s.price)+' AUD'}
function editCustomer(id){const c=state.customers.find(x=>x.id===id)||{id:'',name:'',email:'',phone:'',group:'new',note:''};if(role==='customer'&&id!==guestId)return;modal(t(id?'edit':'add'),`<form id="customer-form" data-id="${c.id}"><div class="form-grid">${field('name','name',c.name,'text','required')}${field('email','email',c.email,'email','required')}${field('phone','phone',c.phone)}${role!=='customer'?select('group','group',['new','regular','returning'].map(x=>[x,t(x)]),c.group):''}</div>${formEnd()}`)}
function editBranch(id){const b=state.branches.find(x=>x.id===id);modal(t('branch'),`<form id="branch-form" data-id="${id}"><div class="form-grid">${field('name','name',b.name,'text','required')}${field('phone','phone',b.phone)}${field('address','address',b.address)}${select('timezone','timezone',['Australia/Sydney','Australia/Melbourne','Australia/Brisbane','Australia/Perth','Australia/Adelaide','Australia/Darwin','Australia/Hobart'].map(x=>[x,x]),b.timezone)}${field('open','open',b.open,'time','required')}${field('closeTime','close',b.close,'time','required')}</div>${formEnd()}`)}
function editService(id){const s=state.services.find(x=>x.id===id)||{id:'',key:'body',price:100,duration:60,buffer:15,branches:['b1','b2']};modal(t('service'),`<form id="service-form" data-id="${s.id}"><div class="form-grid">${field('name','name',sName(s),'text','required')}${select('service','key',['body','facial','foot'].map(x=>[x,t(x)]),s.key)}${field('price','price',s.price,'number','required min="0" step="0.01"')}${field('duration','duration',s.duration,'number','required min="15" max="240" step="15"')}${field('buffer','buffer',s.buffer,'number','required min="0" max="120" step="5"')}</div><div style="margin-top:18px">${state.branches.map(b=>`<label class="check"><input type="checkbox" name="branches" value="${b.id}" ${s.branches.includes(b.id)?'checked':''}>${e(b.name)}</label>`).join('')}</div>${formEnd()}`)}
function editStaff(id){const s=state.staff.find(x=>x.id===id)||{id:'',name:'',branches:['b1'],skills:['s1'],pay:state.settings.pay,rate:32,commission:50};modal(t('staff'),`<form id="staff-form" data-id="${s.id}"><div class="form-grid">${field('name','name',s.name,'text','required')}${select('payType','pay',['hourly','share'].map(x=>[x,t(x)]),s.pay)}${field('rate','rate',s.rate,'number','required min="0" step="0.01"')}${field('commission','commission',s.commission,'number','required min="0" max="100"')}</div><h3 style="margin-top:18px">${e(t('branches'))}</h3>${state.branches.map(b=>`<label class="check"><input type="checkbox" name="branches" value="${b.id}" ${s.branches.includes(b.id)?'checked':''}>${e(b.name)}</label>`).join('')}<h3 style="margin-top:18px">${e(t('services'))}</h3>${state.services.map(x=>`<label class="check"><input type="checkbox" name="skills" value="${x.id}" ${s.skills.includes(x.id)?'checked':''}>${e(sName(x))}</label>`).join('')}${formEnd()}`)}
function editStock(id){let s=state.stock.find(x=>x.id===id)||{id:'',key:'',name:'',branch:'b1',quantity:0,min:5,unit:'pieces'};modal(t('inventory'),`<form id="stock-form" data-id="${s.id}"><div class="form-grid">${field('name','name',s.name||t(s.key),'text','required')}${select('branch','branch',branchOpts(),s.branch)}${field('quantity','quantity',s.quantity,'number','required min="0"')}${field('minimum','min',s.min,'number','required min="0"')}${select('unit','unit',['bottles','pieces','boxes'].map(x=>[x,t(x)]),s.unit)}</div>${formEnd()}`)}
function trainingReview(id){let x=state.training.find(x=>x.id===id);modal(x.name||t(x.key),`<form id="training-form" data-id="${id}">${field('learningLink','url',x.url,'url','placeholder="https://…"')}<div class="form-actions"><button type="submit" class="btn primary">${e(t('save'))}</button></div></form><div style="margin-top:20px">${state.staff.map(s=>`<div class="mini-stat"><span>${e(s.name)}<small style="display:block;font-size:10px;margin-top:5px">${e(t(x.approved.includes(s.id)?'approved':x.done.includes(s.id)?'awaitReview':'todo'))}</small></span>${x.done.includes(s.id)&&!x.approved.includes(s.id)?btn('approveSkill','training-approve',id+'|'+s.id,'small'):''}</div>`).join('')}</div>`)}
function authModal(mode='signIn'){modal(t(mode),`<div class="info-strip">${e(t('authNotice'))}</div><form id="auth-form"><div class="form-grid" style="grid-template-columns:1fr">${mode==='register'?field('name','name','','text','required'):''}${field('email','email','','email','required')}${mode!=='reset'?field('password','password','','password','required minlength="8" autocomplete="off"'):''}</div><div class="form-actions"><button class="btn primary" type="submit">${e(t(mode))}</button></div></form><div class="actions" style="margin-top:20px">${btn('forgot','auth','reset','small')}${btn('register','auth','register','small')}${btn('previewAccount','guest-account','','soft small')}</div>`)}
function simpleForm(type){let fields='',title=type;
if(type==='entry'){title='addEntry';fields=select('category','type',[['in',t('income')],['out',t('expense')]],'out')+field('amount','amount','','number','min="0.01" step="0.01" required')+select('branch','branch',branchOpts(),branch==='all'?'b1':branch)+field('date','date',dayKey(),'date','required')+select('category','category',['services','supplies','wages','rent','other'].map(x=>[x,t(x)]),'supplies')+select('method','method',['cash','card','bank'].map(x=>[x,t(x)]),'cash')+field('description','description');}
if(type==='task'){title='add';fields=field('title','name','','text','required')+select('priority','priority',['high','medium','low'].map(x=>[x,t(x)]),'medium')+field('deadline','date',addDays(dayKey(),1),'date','required');}
if(type==='incident'){fields=select('name','customer',state.customers.map(c=>[c.id,c.name]),'c0')+field('notes','note','','text','required maxlength="1000"');}
if(type==='hours'){title='logHours';fields=select('staff','staff',state.staff.map(x=>[x.id,x.name]),'t1')+field('date','date',dayKey(),'date','required')+field('hoursWorked','hours','','number','min="0.25" max="24" step="0.25" required');}
if(type==='leave'){title='addLeave';fields=select('staff','staff',state.staff.map(x=>[x.id,x.name]),'t1')+field('date','date',addDays(dayKey(),1),'date',`required min="${dayKey()}"`);}
if(type==='document'){title='document';fields=field('title','name','','text','required')+field('learningLink','url','','url','required placeholder="https://…"')+field('expiry','date',addDays(dayKey(),365),'date','required');}
if(type==='training'){title='training';fields=field('title','name','','text','required')+field('learningLink','url','','url','placeholder="https://…"');}
if(type==='transfer'){title='stockTransfer';fields=select('name','stock',state.stock.map(s=>[s.id,(s.name||t(s.key))+' · '+bName(s.branch)]),state.stock[0].id)+select('toBranch','branch',branchOpts(),'b2')+field('quantity','quantity',1,'number','required min="1" step="1"');}
modal(t(title),`<form id="${type}-form"><div class="form-grid">${fields}</div>${formEnd()}`)}
function baseAction(a,id){const adminOnly=['confirm','decline','approve-request','reject-request','edit-branch','edit-service','new-service','new-staff','edit-staff','new-entry','hours','new-document','reset-demo','export'];if(adminOnly.includes(a)&&role!=='admin'){toast(t('readOnly'));return}let b=state.bookings.find(x=>x.id===id);switch(a){
case 'nav':page=id;query='';render();break;case 'menu':$('#sidebar').classList.toggle('open');break;case 'close':dismiss();break;case 'period':period=id;render();break;case 'booking-filter':bookingFilter=id;render();break;case 'guest-filter':guestFilter=id;render();break;case 'setting-tab':settingTab=id;render();break;case 'cal-prev':calStart=addDays(calStart,-7);render();break;case 'cal-next':calStart=addDays(calStart,7);render();break;case 'cal-today':calStart=dayKey();render();break;
case 'portal':return;case 'back-office':return;case 'guest-bookings':case 'guest-account':dismiss();role='customer';page='bookings';branch='all';render();break;case 'explore':$('#treatments').scrollIntoView({behavior:'smooth'});break;case 'auth':authModal(id||'signIn');break;
case 'booking':bookingModal(id);break;case 'new-booking':newBooking();break;case 'book-service':newBooking(id);break;case 'slot':return;{let [staff,date]=id.split('|');let st=state.staff.find(s=>s.id===staff);newBooking(st.skills[0],{staff,date,branch:branch==='all'?st.branches[0]:branch});break;}
case 'confirm':{const err=validateBooking(b,state,b.id);if(err){toast(t(err));break}b.status='confirmed';persist('Booking confirmed');dismiss();render();toast(t('saved'));break;}
case 'decline':b.status='declined';persist('Booking declined');dismiss();render();break;
case 'complete':if(b.status!=='confirmed')return;b.status='completed';persist('Treatment completed');dismiss();render();toast(t('saved'));break;
case 'payment':if(!['admin','manager'].includes(role)||b.status!=='completed'||b.paid)return;modal(t('recordPayment'),`<form id="payment-form" data-id="${id}"><div class="info-strip">${e(cName(b.customer))} · ${money(b.price)} AUD</div>${select('method','method',['cash','card','bank'].map(x=>[x,t(x)]),'cash')}${formEnd('recordPayment')}`);break;
case 'cancel-booking':if(b.status==='pending')b.status='cancelled';else b.request={type:'cancel'};persist('Cancellation requested');dismiss();render();toast(t('requestSent'));break;
case 'request-change':modal(t('requestChange'),`<form id="change-form" data-id="${id}"><div class="form-grid">${field('date','date',b.date,'date',`required min="${dayKey()}"`)}${field('time','time',b.time,'time','required step="900"')}</div>${formEnd('requestChange')}`);break;
case 'approve-request':if(b.request?.type==='cancel'){b.status='cancelled'}else if(b.request){const candidate={...b,date:b.request.date,time:b.request.time};let err=validateBooking(candidate,state,id);if(err){toast(t(err));return}b.date=candidate.date;b.time=candidate.time}b.request=null;persist('Request approved');dismiss();render();break;
case 'reject-request':b.request=null;persist('Request declined');dismiss();render();break;
case 'new-customer':editCustomer('');break;case 'edit-customer':editCustomer(id);break;case 'edit-branch':editBranch(id);break;case 'edit-service':editService(id);break;case 'new-service':editService('');break;case 'edit-staff':editStaff(id);break;case 'new-staff':editStaff('');break;case 'edit-stock':editStock(id);break;case 'new-stock':editStock('');break;case 'transfer':simpleForm('transfer');break;
case 'training-review':trainingReview(id);break;case 'training-done':{let x=state.training.find(x=>x.id===id);if(!x.done.includes(staffId))x.done.push(staffId);persist('Training completion acknowledged');render();toast(t('saved'));break;}case 'training-approve':{let [tid,sid]=id.split('|'),x=state.training.find(x=>x.id===tid);if(!x.approved.includes(sid))x.approved.push(sid);persist('Training competency confirmed');render();trainingReview(tid);break;}
case 'new-training':simpleForm('training');break;case 'new-task':simpleForm('task');break;case 'task-next':{let x=state.tasks.find(x=>x.id===id);x.status=x.status==='todo'?'doing':'done';persist('Task updated');render();break;}case 'new-incident':simpleForm('incident');break;case 'resolve':state.incidents.find(x=>x.id===id).resolved=true;persist('Guest care resolved');render();break;case 'new-entry':simpleForm('entry');break;case 'hours':simpleForm('hours');break;case 'leave':simpleForm('leave');break;case 'new-document':simpleForm('document');break;
case 'tax-detail':modal(t('tax'),`<div class="metric-value">${money(state.settings.taxEstimate)} AUD</div><p style="margin-top:20px">${e(t('financeNote'))}</p><p class="demo-note">${e(t('taxNote'))} · ${e(t('allBranches'))}</p>`);break;
case 'export':{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='thuy-spa-trial.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break;}
case 'reset-demo':modal(t('resetDemo'),`<p>${e(t('resetConfirm'))}</p><div class="form-actions">${btn('cancel','close')}${btn('resetDemo','reset-confirm','','danger')}</div>`);break;case 'reset-confirm':if(role!=='admin')return;state=seed();state.documents=[];persist();dismiss();render();toast(t('saved'));break;
}}
function error(k){const target=$('#form-error');if(target)target.textContent=t(k);else toast(t(k))}
function baseSubmit(form){const data=new FormData(form),v=Object.fromEntries(data),id=form.dataset.id;let changed=true;
switch(form.id){case 'auth-form':form.reset();toast(t('authNotice'));return;
case 'booking-form':{let s=state.services.find(x=>x.id===v.service);let candidate={id:uid(),service:s.id,staff:v.staff,branch:v.branch,date:v.date,time:v.time,price:s.price,duration:s.duration,buffer:s.buffer,status:'pending',paid:false,createdDate:dayKey(),request:null,notes:'',consent:false};if(candidate.staff==='any'){const eligible=state.staff.filter(st=>st.branches.includes(candidate.branch)&&st.skills.includes(candidate.service)).sort((a,b)=>state.bookings.filter(x=>x.staff===a.id&&x.date===candidate.date&&x.status!=='cancelled').length-state.bookings.filter(x=>x.staff===b.id&&x.date===candidate.date&&x.status!=='cancelled').length);const picked=eligible.find(st=>!validateBooking({...candidate,staff:st.id},state));if(!picked)return error('conflict');candidate.staff=picked.id}const err=validateBooking(candidate,state);if(err)return error(err);let email=v.email.trim().toLowerCase(),customer=state.customers.find(c=>c.email.toLowerCase()===email&&c.name.toLowerCase()===v.name.trim().toLowerCase());if(!customer&&state.customers.some(c=>c.email.toLowerCase()===email))return error('duplicateEmail');if(!customer){customer={id:uid(),name:v.name.trim(),email,phone:'',group:'new',note:''};state.customers.push(customer)}candidate.customer=customer.id;state.bookings.push(candidate);persist('Appointment requested');dismiss();render();toast(t('bookingSent'));return;}
case 'customer-form':{if(role==='customer'&&id!==guestId)return;const duplicate=state.customers.find(c=>c.email.toLowerCase()===v.email.trim().toLowerCase()&&c.id!==id);if(duplicate)return error(lang==='en'?'This email already belongs to a guest. Review that record first.':lang==='vi'?'Email đã có trong hồ sơ khách. Hãy kiểm tra hồ sơ hiện có.':'อีเมลนี้มีอยู่แล้ว กรุณาตรวจสอบข้อมูลเดิม');let c=state.customers.find(x=>x.id===id);if(c)Object.assign(c,{...v,email:v.email.trim().toLowerCase()});else state.customers.push({id:uid(),note:'',...v,email:v.email.trim().toLowerCase()});break;}
case 'branch-form':if(role!=='admin')return;if(v.open>=v.close)return error('hours');Object.assign(state.branches.find(x=>x.id===id),v);break;
case 'service-form':{if(role!=='admin')return;const branches=data.getAll('branches');if(!branches.length)return error('invalid');const values={...v,price:Number(v.price),duration:Number(v.duration),buffer:Number(v.buffer),branches,image:'assets/'+v.key+'.svg'};let s=state.services.find(x=>x.id===id);if(s)Object.assign(s,values);else state.services.push({id:uid(),...values});break;}
case 'staff-form':{if(role!=='admin')return;const branches=data.getAll('branches'),skills=data.getAll('skills');if(!branches.length||!skills.length)return error('invalid');let s=state.staff.find(x=>x.id===id),values={...v,branches,skills,rate:Number(v.rate),commission:Number(v.commission)};if(s)Object.assign(s,values);else state.staff.push({id:uid(),...values});break;}
case 'stock-form':{let x=state.stock.find(x=>x.id===id),values={...v,quantity:Number(v.quantity),min:Number(v.min)};if(x)Object.assign(x,values);else state.stock.push({id:uid(),...values});break;}
case 'training-form':{if(v.url&&!/^https?:\/\//i.test(v.url))return error('invalid');if(id)state.training.find(x=>x.id===id).url=v.url;else state.training.push({id:uid(),name:v.name,url:v.url,required:true,done:[],approved:[]});break;}
case 'business-form':if(role!=='admin')return;Object.assign(state.settings,{travel:Number(v.travel),pay:v.pay,taxEstimate:Number(v.tax),setup:true});break;
case 'payment-form':{let b=state.bookings.find(x=>x.id===id);if(!b||b.paid||b.status!=='completed'||!['admin','manager'].includes(role))return;b.paid=true;state.ledger.push({id:uid(),booking:id,date:dayKey(),type:'in',amount:b.price,branch:b.branch,category:'services',method:v.method,description:cName(b.customer)});break;}
case 'change-form':{let b=state.bookings.find(x=>x.id===id);let err=validateBooking({...b,...v},state,id);if(err)return error(err);b.request={type:'change',date:v.date,time:v.time};break;}
case 'entry-form':if(role!=='admin')return;state.ledger.push({id:uid(),...v,amount:Number(v.amount)});break;
case 'task-form':state.tasks.push({id:uid(),...v,status:'todo'});break;
case 'incident-form':state.incidents.push({id:uid(),...v,date:dayKey(),resolved:false});break;
case 'hours-form':if(role!=='admin')return;state.timesheets.push({id:uid(),...v,hours:Number(v.hours)});break;
case 'leave-form':if(state.bookings.some(b=>b.staff===v.staff&&b.date===v.date&&!['cancelled','declined'].includes(b.status)))return error('leaveConflict');state.leave.push({id:uid(),...v});break;
case 'document-form':if(role!=='admin')return;if(!/^https?:\/\//i.test(v.url))return error('invalid');state.documents.push({id:uid(),...v});break;
case 'transfer-form':{let source=state.stock.find(x=>x.id===v.stock),qty=Number(v.quantity);if(source.branch===v.branch)return error('invalid');if(source.quantity<qty)return error('shortStock');let target=state.stock.find(x=>x.branch===v.branch&&(x.name||x.key)===(source.name||source.key)&&x.unit===source.unit);if(!target){target={...source,id:uid(),branch:v.branch,quantity:0};state.stock.push(target)}source.quantity-=qty;target.quantity+=qty;break;}
default:changed=false;
}if(changed){persist(form.id.replace('-form','')+' updated');dismiss();render();toast(t('saved'))}}
document.addEventListener('click',ev=>{const button=ev.target.closest('[data-action]');if(button){ev.preventDefault();action(button.dataset.action,button.dataset.id||'')}});
document.addEventListener('submit',ev=>{ev.preventDefault();if(ev.target.checkValidity())submit(ev.target);else ev.target.reportValidity()});
document.addEventListener('change',ev=>{const target=ev.target;if(target.id==='language'){lang=target.value;trialStorage.setItem('thuy-language',lang);render()}if(target.id==='role'){return;role=target.value;page=role==='customer'?'portal':role==='technician'?'calendar':'dashboard';branch='all';render()}if(target.id==='branch-filter'){branch=target.value;render()}if(target.closest('#booking-form')&&['service','branch'].includes(target.name))updateBookingOptions();if(target.dataset.permission&&role==='admin'){let [r,p]=target.dataset.permission.split('|');if(target.checked&&!state.settings.modules[r].includes(p))state.settings.modules[r].push(p);else if(!target.checked)state.settings.modules[r]=state.settings.modules[r].filter(x=>x!==p);persist('Module access updated');toast(t('saved'))}if(target.dataset.consent){let b=state.bookings.find(b=>b.id===target.dataset.consent);b.consent=target.checked;persist('Consent acknowledgement updated')}});
document.addEventListener('input',ev=>{if(ev.target.id==='search'){const start=ev.target.selectionStart;query=ev.target.value;render();const input=$('#search');input.focus();input.setSelectionRange(start,start)}});

VN',th:'th-TH'}[lang],{weekday:'long'}).format(new Date(d+'T12:00:00Z'))}</small></td><td>${r?r.start+'–'+r.end:'—'}</td><td>${r?e(bName(r.branch)):'—'}</td><td>${bs.map(b=>`<button class="cal-event ${b.status}" data-action="booking" data-id="${b.id}"><strong>${b.time} · ${e(cName(b.customer))}</strong><span>${e(sName(state.services.find(s=>s.id===b.service)))}</span></button>`).join('')||'—'}</td><td>${r?overlappingLeave(r).length?badge('leaveApproved'):badge('rosterConfirmed'):badge('notRostered')}</td></tr>`}).join('')}</tbody></table></div></section>`}
function availabilityPage(){return heading('availability','sevenWeeks',btn('registerShift','ktv-register','','primary','plus'))+`<div class="info-strip">${e(t('availabilityNote'))}<br>${e(t('next49'))} ${dt(addDays(dayKey(),48))}.</div><div class="tabs">${Array.from({length:7},(_,i)=>`<button class="pill-tab ${rosterWeek===i?'active':''}" data-action="register-week" data-id="${i}">${e(t('weekLabel'))} ${i+1} · ${dt(addDays(dayKey(),i*7))}</button>`).join('')}</div><section class="panel"><div class="table-wrap"><table><thead><tr><th>${e(t('date'))}</th><th>${e(t('workHours'))}</th><th>${e(t('branch'))}</th><th>${e(t('status'))}</th><th></th></tr></thead><tbody>${Array.from({length:7},(_,i)=>addDays(dayKey(),rosterWeek*7+i)).map(d=>{const a=state.availability.filter(x=>x.staff===staffId&&x.date===d);return `<tr><td>${dt(d)}</td><td>${a.length?a.map(x=>x.start+'–'+x.end).join('<br>'):'—'}</td><td>${a.length?a.map(x=>e(bName(x.branch))).join('<br>'):'—'}</td><td>${a.length?badge('registered'):'—'}</td><td>${a.length?a.map(x=>btn('withdraw','withdraw-availability',x.id,'small')).join(''):btn('registerShift','ktv-register',d,'small')}</td></tr>`}).join('')}</tbody></table></div></section>`}

function timeOffPage(){const rows=state.leaveRequests.filter(x=>x.staff===staffId).slice().reverse();return heading('timeoff','',btn('requestLeave','ktv-leave','','primary','plus')+btn('urgentLeave','ktv-urgent','','danger'))+`<div class="info-strip">${e(t('leaveNote'))}<br>${e(t('localRequests'))}</div><section class="panel">${rows.map(x=>`<div class="training-row"><span class="circle-icon">${ic(x.type==='urgent'?'bell':'calendar')}</span><div><h3>${dt(x.from)}${x.to!==x.from?' – '+dt(x.to):''} · ${e(t(x.type==='urgent'?'urgentLeave':'plannedLeave'))} ${x.sample?badge('sample'):''}</h3><p>${x.full?e(t('fullDay')):x.start+'–'+x.end} · ${e(x.reason||t(x.reasonKey))}</p>${x.reviewer?`<p>${e(t('reviewedBy'))}: ${e(x.reviewer)} · ${e(x.review||t(x.reviewKey))}</p>`:''}<p>${e(t('affectedBookings'))}: ${affectedAppointments(x).length}</p></div><div class="actions">${leaveStatus(x)}${x.status==='pending'?btn('withdraw','withdraw-leave',x.id,'small'):''}</div></div>`).join('')||`<div class="empty">${e(t('empty'))}</div>`}</section>`}

function leaveForm(urgent=false){modal(t(urgent?'urgentLeave':'requestLeave'),`<form id="ktv-leave"><div class="info-strip">${e(t('leaveNote'))}</div><div class="form-grid">${select('leaveType','type',[['planned',t('plannedLeave')],['urgent',t('urgentLeave')]],urgent?'urgent':'planned')}${select('leavePeriod','period',[['full',t('fullDay')],['partial',t('partialDay')]],'full')}${field('startDate','from',dayKey(),'date',`required min="${dayKey()}"`)}${field('endDate','to',dayKey(),'date',`required min="${dayKey()}"`)}${field('startTime','start','09:00','time','required')}${field('endTime','end','17:00','time','required')}<label class="field full"><span>${e(t('reason'))}</span><textarea name="reason" required minlength="5" maxlength="1000"></textarea></label></div><p class="demo-note">${e(t('localRequests'))}</p>${formEnd('requestLeave')}`)}
function earningsPage(){const rows=state.myPay.filter(x=>x.staff===staffId&&x.date.startsWith(payMonth)),total=rows.reduce((a,x)=>a+x.amount,0),paid=rows.filter(x=>x.paid).reduce((a,x)=>a+x.amount,0),hours=rows.reduce((a,x)=>a+(x.hours||0),0),me=state.staff.find(x=>x.id===staffId);return heading('earnings','monthlyPayNote')+`<div class="toolbar"><label class="field"><span>${e(t('monthSelect'))}</span><input type="month" id="ktv-pay-month" value="${payMonth}"></label><span class="badge">${e(t('payLocked'))} · ${e(t(me.pay))} · ${me.pay==='hourly'?money(me.rate)+'/h':me.commission+'%'}</span></div><div class="metrics"><div class="metric"><div class="metric-head">${e(t('earnedPay'))}</div><div class="metric-value">${money(total)}<span>AUD</span></div></div><div class="metric"><div class="metric-head">${e(t('paidToMe'))}</div><div class="metric-value">${money(paid)}<span>AUD</span></div></div><div class="metric accent"><div class="metric-head">${e(t('outstandingPay'))}</div><div class="metric-value">${money(total-paid)}<span>AUD</span></div></div><div class="metric"><div class="metric-head">${e(t('hoursWorked'))}</div><div class="metric-value">${hours}</div></div></div><div class="info-strip">${e(t('monthlyPayNote'))}</div><section class="panel"><div class="panel-head"><h2>${e(t('payBreakdown'))}</h2>${badge('sample')}</div><div class="table-wrap"><table><thead><tr><th>${e(t('date'))}</th><th>${e(t('payBasis'))}</th><th>${e(t('amount'))}</th><th>${e(t('status'))}</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${dt(x.date)}</td><td>${x.model==='hourly'?x.hours+' h × '+money(x.rate):money(x.revenue)+' × '+x.percent+'%'}</td><td>${money(x.amount)}</td><td>${badge(x.paid?'paid':'unpaid')}</td></tr>`).join('')||`<tr><td colspan="4" class="empty">${e(t('noPay'))}</td></tr>`}</tbody></table></div></section>`}
function action(a,id){if(a==='ktv-register'){registerForm(id);return}if(a==='ktv-leave'||a==='ktv-urgent'){leaveForm(a==='ktv-urgent');return}if(a==='roster-prev'||a==='roster-next'){rosterWeek=Math.min(6,Math.max(0,rosterWeek+(a==='roster-next'?1:-1)));render();return}if(a==='register-week'){rosterWeek=Number(id);render();return}if(a==='withdraw-availability'){state.availability=state.availability.filter(x=>!(x.id===id&&x.staff===staffId));persist('Availability withdrawn');render();return}if(a==='withdraw-leave'){let x=state.leaveRequests.find(x=>x.id===id&&x.staff===staffId);if(x?.status==='pending')x.status='withdrawn';persist('Leave request withdrawn');render();return}return baseAction(a,id)}
function submit(form){if(!['ktv-availability','ktv-leave'].includes(form.id))return baseSubmit(form);const data=new FormData(form),v=Object.fromEntries(data);if(v.from<dayKey()||v.to<v.from||v.start>=v.end)return error('outsideHorizon');if(form.id==='ktv-availability'){if(v.to>addDays(dayKey(),48))return error('outsideHorizon');const days=data.getAll('days').map(Number),dates=[];for(let date=v.from;date<=v.to;date=addDays(date,1)){if(days.includes(new Date(date+'T12:00:00Z').getUTCDay()))dates.push(date)}if(!dates.length)return error('noDays');if(!state.staff.find(x=>x.id===staffId).branches.includes(v.branch))return error('unavailable');if(dates.some(d=>state.availability.some(x=>x.staff===staffId&&x.date===d&&x.start<v.end&&x.end>v.start)))return error('alreadyRequested');dates.forEach(date=>state.availability.push({id:uid(),staff:staffId,date,start:v.start,end:v.end,branch:v.branch,status:'registered'}));persist('Availability registered');dismiss();render();toast(t('availabilitySubmitted'));return}
if(!v.reason?.trim()||v.reason.trim().length<5)return error('invalid');const full=v.period==='full';if(state.leaveRequests.some(x=>x.staff===staffId&&['pending','approved'].includes(x.status)&&x.from<=v.to&&x.to>=v.from&&(x.full||full||x.start<v.end&&x.end>v.start)))return error('alreadyRequested');state.leaveRequests.push({id:uid(),staff:staffId,from:v.from,to:v.to,start:v.start,end:v.end,type:v.type,full,reason:v.reason.trim(),status:'pending',reviewer:null,review:null,at:new Date().toISOString()});persist('Leave requested — awaiting Admin / Manager');dismiss();page='timeoff';render();toast(t('leaveSubmitted'))}
document.addEventListener('change',ev=>{if(ev.target.id==='ktv-pay-month'&&/^\d{4}-\d{2}$/.test(ev.target.value)){payMonth=ev.target.value;render()}});

render();

})();</script><noscript>Vui lòng bật JavaScript để dùng bản chạy thử. Please enable JavaScript.</noscript></body></html>
